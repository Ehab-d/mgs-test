<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الباصات – المدرسة المصرية الألمانية للغات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login" hidden>
  <!-- DEMO: بيانات الدخول معبّأة مسبقًا مؤقتًا. احذف value="system" من الحقلين بعد العرض -->
  <form id="loginForm" class="login-card">
    <img src="logo.png" alt="شعار المدرسة">
    <h1>المدرسة المصرية الألمانية للغات</h1>
    <p>إدارة الباصات وتسكين الطلبة – تسجيل الدخول</p>
    <label>اسم المستخدم<input name="email" type="text" value="system" required autocomplete="username" autocapitalize="none" dir="ltr"></label>
    <label>كلمة المرور<input name="password" type="password" value="system" required autocomplete="current-password" dir="ltr"></label>
    <button class="btn red" type="submit">دخول</button>
    <div id="loginErr" class="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <img src="logo.png" alt="شعار المدرسة">
    <div class="ttl"><h1>المدرسة المصرية الألمانية للغات</h1><p>إدارة الباصات وتسكين الطلبة</p></div>
    <span class="sp"></span>
    <button class="btn ghost" id="account">حسابي</button>
    <button class="btn ghost" id="logout">خروج</button>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="التنقل"><div class="tabbar" id="tabs"><span class="ind" aria-hidden="true"></span>
    <button data-v="students" aria-label="الطلبة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>الطلبة</span></button>
    <button data-v="routes" aria-label="خطوط السير"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg><span>خطوط السير</span></button>
    <button data-v="drivers" aria-label="السائقين"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/><path d="M12 14v8"/><path d="M10 12H2.5"/><path d="M14 12h7.5"/></svg><span>السائقين</span></button>
    <button data-v="supervisors" aria-label="المشرفات"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg><span>المشرفات</span></button>
    <button data-v="buses" aria-label="الباصات"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg><span>الباصات</span></button>
  </div></nav>
</div>
<div id="printArea"></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/students.js"></script>
<script src="js/routes.js"></script>
<script src="js/lookups.js"></script>
<script src="js/app.js"></script>
</body>
</html>
