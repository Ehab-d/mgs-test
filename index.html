<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الباصات – المدرسة المصرية الألمانية للغات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login" hidden>
  <form id="loginForm" class="login-card">
    <img src="logo.png" alt="شعار المدرسة">
    <h1>المدرسة المصرية الألمانية للغات</h1>
    <p>إدارة الباصات وتسكين الطلبة – تسجيل الدخول</p>
    <label>اسم المستخدم<input name="email" type="text" required autocomplete="username" autocapitalize="none" dir="ltr"></label>
    <label>كلمة المرور<input name="password" type="password" required autocomplete="current-password" dir="ltr"></label>
    <button class="btn red" type="submit">دخول</button>
    <div id="loginErr" class="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <img src="logo.png" alt="شعار المدرسة">
    <div class="ttl"><h1>المدرسة المصرية الألمانية للغات</h1><p>إدارة الباصات وتسكين الطلبة</p></div>
    <span class="sp"></span>
    <button class="btn ghost" id="logout">خروج</button>
  </header>
  <nav class="tabs"><div class="tabbar" id="tabs"><span class="ind" aria-hidden="true"></span>
    <button data-v="students">الطلبة</button>
    <button data-v="routes">خطوط السير</button>
    <button data-v="drivers">السائقين</button>
    <button data-v="supervisors">المشرفات</button>
    <button data-v="buses">الباصات</button>
  </div></nav>
  <main id="main"></main>
</div>
<div id="printArea"></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/students.js"></script>
<script src="js/routes.js"></script>
<script src="js/lookups.js"></script>
<script src="js/app.js"></script>
</body>
</html>
