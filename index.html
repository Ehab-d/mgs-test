<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الباصات – المدرسة المصرية الألمانية للغات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<body>
<div id="login" hidden>
  <!-- DEMO: بيانات الدخول معبّأة مسبقًا مؤقتًا. احذف value="وليد" من الحقلين بعد العرض -->
  <form id="loginForm" class="login-card">
    <img src="logo.png" alt="شعار المدرسة">
    <h1>المدرسة المصرية الألمانية للغات</h1>
    <p>إدارة الباصات وتسكين الطلبة – تسجيل الدخول</p>
    <label>اسم المستخدم<input name="email" type="text" value="وليد" required autocomplete="username" autocapitalize="none" dir="ltr"></label>
    <label>كلمة المرور<input name="password" type="password" value="وليد" required autocomplete="current-password" dir="ltr"></label>
    <button class="btn red" type="submit">دخول</button>
    <div id="loginErr" class="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <img src="logo.png" alt="شعار المدرسة">
    <div class="ttl"><h1>المدرسة المصرية الألمانية للغات</h1><p>إدارة الباصات وتسكين الطلبة</p></div>
    <span class="sp"></span>
    <button class="btn ghost" id="account">حسابي</button>
    <button class="btn ghost" id="logout">خروج</button>
  </header>
  <nav class="tabs" aria-label="التنقل"><div class="tabbar" id="tabs"><span class="ind" aria-hidden="true"></span>
    <button data-v="students"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg><span>الطلبة</span></button>
    <button data-v="routes"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg><span>خطوط السير</span></button>
    <button data-v="drivers"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16 10h2"/><path d="M16 14h2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><circle cx="9" cy="11" r="2"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg><span>السائقين</span></button>
    <button data-v="supervisors"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg><span>المشرفات</span></button>
    <button data-v="buses"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg><span>الباصات</span></button>
  </div></nav>
  <main id="main"></main>
  </div>
<div id="printArea"></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
