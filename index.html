<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الباصات وتسكين الطلبة – المدرسة المصرية الألمانية للغات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2f6b;--red:#b5192a;--bg:#f6f6f8;--card:#fff;--ink:#1d2030;--mute:#6b7085;--line:#e3e4ec;--ok:#1d7a4b;--okbg:#e3f4ea;--badbg:#fde8ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141d;--card:#1b1e2b;--ink:#eceef6;--mute:#9a9fb5;--line:#2c3042;--navy:#8fa5f0;--okbg:#17382a;--badbg:#42191f;--ok:#6fd6a2}}
:root[data-theme="dark"]{--bg:#12141d;--card:#1b1e2b;--ink:#eceef6;--mute:#9a9fb5;--line:#2c3042;--navy:#8fa5f0;--okbg:#17382a;--badbg:#42191f;--ok:#6fd6a2}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
header{background:var(--card);border-bottom:4px solid var(--red);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:62px;background:#fff;border-radius:6px}
header h1{margin:0;font-size:1.3rem;font-weight:800;color:var(--red);line-height:1.3}
header p{margin:0;font-size:.85rem;color:var(--mute)}
.sp{flex:1}
.layout{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px 20px;max-width:1400px;margin:auto}
aside h2,.main h2{font-size:1rem;margin:0 0 10px;color:var(--navy)}
.route{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit}
.route .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--card);display:grid;place-items:center;font-weight:800}
.route b{display:block;font-size:.95rem;line-height:1.3}.route small{color:var(--mute)}
.route .c{margin-inline-start:auto;font-size:.8rem;color:var(--mute)}
.route[aria-pressed=true]{border-color:var(--red);box-shadow:inset -4px 0 0 var(--red)}
.route[aria-pressed=true] .n{background:var(--red);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:.78rem;color:var(--mute);gap:2px}
input,select{font:inherit;font-size:.9rem;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);min-width:0}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600;background:var(--navy);color:#fff}
:root:not([data-theme="light"]) .btn{color:#10131c}
.btn.red{background:var(--red);color:#fff!important}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px}
.stat b{font-size:1.4rem;color:var(--navy);display:block;line-height:1.2}.stat span{font-size:.8rem;color:var(--mute)}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.rhead h2{margin:0;font-size:1.15rem;color:var(--ink)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{background:var(--navy);color:#fff;text-align:right;font-size:.82rem;padding:9px 10px;white-space:nowrap}
:root:not([data-theme="light"]) th{color:#10131c}
td{padding:8px 10px;border-top:1px solid var(--line);font-size:.9rem;vertical-align:top}
tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 60%,transparent)}
td.ph{direction:ltr;text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;font-weight:600}
.tag.y{background:var(--okbg);color:var(--ok)}.tag.n{background:var(--badbg);color:var(--red)}
.g{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-weight:600;font-size:.8rem}
.ic{background:none;border:0;padding:4px 6px;color:var(--mute);font-size:.8rem}.ic:hover{color:var(--red)}
.empty{padding:30px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog h3{grid-column:1/-1;margin:0;color:var(--red)}
.full{grid-column:1/-1}.chk{flex-direction:row;align-items:center;gap:8px;font-size:.95rem;color:var(--ink)}
.chk input{width:20px;height:20px}
.acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-start}
@media(max-width:820px){.layout{grid-template-columns:1fr;padding:12px}dialog form{grid-template-columns:1fr}}
@media print{header .btn,aside,.bar,.ic,.acts,.no-print{display:none!important}.layout{display:block}body{background:#fff;color:#000}th{background:#ddd!important;color:#000!important}}
</style>
</head>

S('r1','فريدة يحيى السيد مدحت','G3','ڤيلا مدحت الفقي – أمام اللواء مختار عبدالوكيل – الحي الثاني','01000849919','01005255430'),
S('r1','أشرف يحيى السيد مدحت','KG2','ڤيلا مدحت الفقي – أمام اللواء مختار عبدالوكيل – الحي الثاني','01000849919','01005255430'),
S('r1','مكاريوس ملاك عصفور','G1','خلف السجل المدني – الحي الثاني','01156534621'),
S('r1','لوسندا ملاك عصفور','G1','خلف السجل المدني – الحي الثاني','01156534621'),
S('r1','سلمى محمد أحمد فريد','G1','خلف سيتي سكيب مول','01122241973','01122238587'),
S('r1','لورين أحمد','G4','عمارة (21) جنة مصر','01202979238'),
S('r1','تولين أحمد','G9','عمارة (21) جنة مصر','01202979238'),
S('r1','جودي أحمد','G8','عمارة (21) جنة مصر','01202979238')]});
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.routes)D=seed();
let cur='all',editS=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rt=id=>D.routes.find(r=>r.id===id);
const fill=(el,items,all)=>{el.innerHTML=(all?`<option value="">${all}</option>`:'')+items.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')};
function filtered(){
 const q=$('q').value.trim(),g=$('fg').value,s=$('fs').value,p=$('fp').value;
 return D.stu.filter(x=>{const r=rt(x.r);if(!r)return false;
  if(cur!=='all'&&x.r!==cur)return false;
  if(g&&x.g!==g)return false;if(s&&r.sup!==s)return false;
  if(p!==''&&(x.paid?'1':'0')!==p)return false;
  if(q&&!(x.n+x.p1+x.p2+x.a).includes(q))return false;return true})}
function render(){
 D.routes.sort((a,b)=>a.num-b.num);
 const sups=[...new Set(D.routes.map(r=>r.sup).filter(Boolean))];
 const fs=$('fs').value,fg=$('fg').value;
 fill($('fs'),sups.map(s=>[s,s]),'كل المشرفات');$('fs').value=sups.includes(fs)?fs:'';
 fill($('fg'),GR.map(g=>[g,g]),'كل الصفوف');$('fg').value=fg;
 $('routes').innerHTML=`<button class="route" aria-pressed="${cur==='all'}" data-r="all"><span class="n">★</span><span><b>كل الخطوط</b><small>${D.stu.length} طالب</small></span></button>`+
 D.routes.map(r=>`<button class="route" aria-pressed="${cur===r.id}" data-r="${r.id}"><span class="n">${r.num}</span><span><b>${esc(r.name)}</b><small>${esc(r.sup||'بدون مشرفة')}</small></span><span class="c">${D.stu.filter(s=>s.r===r.id).length}</span></button>`).join('');
 const r=rt(cur);
 $('rt').textContent=r?`خط سير (${r.num}) ${r.name}`:'كل خطوط السير';
 $('editR').hidden=!r;
 const L=filtered(),paid=L.filter(x=>x.paid).length;
 $('stats').innerHTML=[[L.length,'عدد الطلبة'],[paid,'دافع باص'],[L.length-paid,'غير دافع']].map(([a,b])=>`<div class="stat"><b>${a}</b><span>${b}</span></div>`).join('');
 $('tb').innerHTML=L.map((x,i)=>{const rr=rt(x.r);return `<tr><td>${i+1}</td><td><b>${esc(x.n)}</b></td><td><span class="g">${x.g}</span></td><td>${esc(x.a)||'—'}</td><td class="ph">${[x.p1,x.p2].filter(Boolean).map(esc).join('<br>')||'—'}</td><td><span class="tag ${x.paid?'y':'n'}">${x.paid?'دافع':'غير دافع'}</span></td><td>${rr.num} – ${esc(rr.name)}</td><td class="no-print"><button class="ic" onclick="openStu('${x.id}')">تعديل</button></td></tr>`}).join('');
 $('em').hidden=L.length>0;
}
$('routes').onclick=e=>{const b=e.target.closest('.route');if(b){cur=b.dataset.r;render()}};
['q','fg','fs','fp'].forEach(i=>$(i).oninput=render);
function resetF(){['q','fg','fs','fp'].forEach(i=>$(i).value='');render()}
function openStu(id){
 editS=id?D.stu.find(s=>s.id===id):null;const x=editS||{};
 fill($('sg'),GR.map(g=>[g,g]));fill($('sr'),D.routes.map(r=>[r.id,`${r.num} – ${r.name}`]));
 $('dst').textContent=editS?'تعديل بيانات الطالب':'إضافة طالب';
 $('sn').value=x.n||'';$('sg').value=x.g||'G1';$('sr').value=x.r||(cur!=='all'?cur:D.routes[0]?.id||'');
 $('sa').value=x.a||'';$('s1').value=x.p1||'';$('s2').value=x.p2||'';$('sp').checked=!!x.paid;
 $('sdel').hidden=!editS;ds.showModal()}
function saveStu(){
 const n=$('sn').value.trim();if(!n){$('sn').focus();return}
 if(!$('sr').value){alert('أضف خط سير أولًا');return}
 const o={n,g:$('sg').value,r:$('sr').value,a:$('sa').value.trim(),p1:$('s1').value.trim(),p2:$('s2').value.trim(),paid:$('sp').checked};
 if(editS)Object.assign(editS,o);else D.stu.push({id:String(Date.now()),...o});
 save();ds.close();render()}
function delStu(){if(editS&&confirm('حذف الطالب '+editS.n+'؟')){D.stu=D.stu.filter(s=>s!==editS);save();ds.close();render()}}
let editR=null;
function openRoute(id){
 editR=id&&id!=='all'?rt(id):null;const x=editR||{};
 $('drt').textContent=editR?'تعديل خط السير':'إضافة خط سير';
 $('rn').value=x.num||(Math.max(0,...D.routes.map(r=>r.num))+1);$('rm').value=x.name||'';$('rs').value=x.sup||'';
 $('rdel').hidden=!editR;dr.showModal()}
function saveRoute(){
 const num=+$('rn').value,name=$('rm').value.trim();if(!num||!name){alert('اكتب رقم الخط واسمه');return}
 const o={num,name,sup:$('rs').value.trim()};
 if(editR)Object.assign(editR,o);else{const r={id:'r'+Date.now(),...o};D.routes.push(r);cur=r.id}
 save();dr.close();render()}
function delRoute(){const n=D.stu.filter(s=>s.r===editR.id).length;
 if(confirm(`حذف الخط وكل طلابه (${n})؟`)){D.stu=D.stu.filter(s=>s.r!==editR.id);D.routes=D.routes.filter(r=>r!==editR);cur='all';save();dr.close();render()}}
const ds=$('ds'),dr=$('dr');
render();
</script>
